StylesPath = styles
MinAlertLevel = warning

[formats]
mdx = md

[src/data/blog/**/*.md]
BasedOnStyles = Wicksipedia

# The prose on CMS pages lives inside YAML frontmatter (`blocks[].body`), which
# Vale does not read — a section pointed at `content/pages/**/*.mdx` reports
# "0 errors in 2 files" and keeps reporting it with banned words in the prose.
# `scripts/check-page-prose.mjs` extracts those bodies into this scratch
# directory as real Markdown so they are actually linted. It asserts Vale's own
# "in N files" count matches what it wrote, so deleting this section fails the
# check loudly instead of silently linting nothing.
[.vale-tmp/**/*.md]
BasedOnStyles = Wicksipedia
