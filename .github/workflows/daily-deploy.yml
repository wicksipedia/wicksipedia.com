name: Daily deploy
on:
  schedule:
    - cron: '0 20 * * *' # 6am AEST (UTC+10)
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install

      - name: Cache Astro build artifacts
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-build-${{ hashFiles('src/assets/images/**', 'src/assets/uploads/**', 'src/data/blog/**/*.{png,jpg,jpeg,gif,webp,svg,avif}') }}
          restore-keys: |
            astro-build-

      # build:local, not build, until Phase 4 wires Tina Cloud. `bun run build`
      # is --content=local, which the CLI refuses without clientId+token because
      # the client it generates has to point at TinaCloud
      # (ERR_MISSING_CLOUD_CREDS). Switch this to `bun run build` the moment the
      # secrets exist — see Task 4.0 in the migration plan.
      - run: bun run build:local
      - run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
